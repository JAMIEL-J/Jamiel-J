<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 390" width="830" height="390" role="img" aria-labelledby="t d"><title id="t">Jamiel J., financial data analyst</title><desc id="d">Financial data analyst in Tamil Nadu, India. I build credit-risk models, fraud detection and driver forecasts, plus a natural-language-to-SQL analytics platform.</desc><style>@font-face{font-family:GSESerif;font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSESerif;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:GSE,"Google Sans",system-ui,sans-serif;text-rendering:geometricPrecision}text.serif{font-family:GSESerif,"Instrument Serif",Georgia,serif}text.italic{font-style:italic}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.35)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.68}}
.fade{animation:fade .9s ease-out backwards}
.sweep{animation:sweep 7s linear infinite;will-change:transform}
.wave{animation:wave 3.4s ease-in-out infinite}
.rise,.col{animation:rise .75s cubic-bezier(.22,.8,.24,1) backwards}
.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1) backwards;transform-box:fill-box;transform-origin:50% 50%}
.grow{animation:grow .85s cubic-bezier(.22,.8,.24,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
.draw{stroke-dasharray:1;animation:draw .9s ease-out backwards}
.s{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.m{display:none}
.s{display:inline}
}
</style><defs><clipPath id="card"><rect width="830" height="390" rx="20"/></clipPath></defs><g clip-path="url(#card)"><rect width="830" height="390" fill="#F0E8D6"/><rect x="588" width="242" height="390" fill="#1F4B35" class="fade" style="animation-delay:0.05s"/><circle cx="578" cy="212" r="80" fill="#D8402B" class="pop" style="animation-delay:0.35s"/><circle cx="612" cy="180" r="76" fill="#F0E8D6" class="pop" style="animation-delay:0.50s"/><circle cx="612" cy="180" r="81" fill="none" stroke="#F0E8D6" stroke-width="1.5" class="fade" style="animation-delay:0.62s"/><text x="612" y="197" font-size="50" font-weight="400" fill="#1F4B35" text-anchor="middle" class="serif italic pop" style="animation-delay:0.66s">JJ</text><g class="m"><circle cx="612" cy="180" r="81" fill="none" stroke="#F0E8D6" stroke-width="2" opacity="0"><animate attributeName="r" values="81;104" dur="3.2s" begin="1.50s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3.2s" begin="1.50s" repeatCount="indefinite"/></circle></g><g class="s"></g><path d="M620 304V360" stroke="#53725D" stroke-width="1" class="fade" style="animation-delay:0.30s"/><text x="636" y="310" font-size="16" font-weight="400" fill="#F0E8D6" class="serif italic rise" style="animation-delay:0.50s">Turning messy data into</text><text x="636" y="332" font-size="16" font-weight="400" fill="#F0E8D6" class="serif italic rise" style="animation-delay:0.60s">defensible decisions.</text><rect x="40" y="60" width="36" height="4" rx="2" fill="#D8402B" class="rise" style="animation-delay:0.10s"/><text x="40" y="84" font-size="12" font-weight="700" fill="#1F4B35" letter-spacing="2.6" class="rise" style="animation-delay:0.12s">FINANCIAL DATA ANALYST</text><text x="32" y="240" font-size="124" font-weight="400" fill="#1F4B35" letter-spacing="-2" class="serif rise" style="animation-delay:0.22s">Jamiel</text><text x="298.6" y="240" font-size="124" font-weight="400" fill="#D8402B" letter-spacing="-2" class="serif italic rise" style="animation-delay:0.34s">J.</text><path d="M40 284H500" stroke="#53725D" stroke-width="1" class="fade" style="animation-delay:0.40s"/><text x="40" y="312" font-size="15" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:0.50s">Financial data analyst in Tamil Nadu, India. I build credit-risk models,</text><text x="40" y="334" font-size="15" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:0.62s">fraud detection and driver forecasts, plus a natural-language-to-SQL</text><text x="40" y="356" font-size="15" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:0.74s">analytics platform.</text></g></svg>
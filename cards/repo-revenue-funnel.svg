<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 156" width="830" height="156" role="img" aria-labelledby="t d"><title id="t">Revenue Funnel Analysis: $1.14M annualised leakage isolated</title><desc id="d">Multi-stage drop-off analysis across cart, checkout, payment and purchase, quantifying revenue lost.</desc><style>@font-face{font-family:GSESerif;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:GSE,"Google Sans",system-ui,sans-serif;text-rendering:geometricPrecision}text.serif{font-family:GSESerif,"Instrument Serif",Georgia,serif}text.italic{font-style:italic}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.35)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.68}}
.fade{animation:fade .9s ease-out backwards}
.sweep{animation:sweep 7s linear infinite;will-change:transform}
.wave{animation:wave 3.4s ease-in-out infinite}
.rise,.col{animation:rise .75s cubic-bezier(.22,.8,.24,1) backwards}
.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1) backwards;transform-box:fill-box;transform-origin:50% 50%}
.grow{animation:grow .85s cubic-bezier(.22,.8,.24,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
.draw{stroke-dasharray:1;animation:draw .9s ease-out backwards}
.s{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.m{display:none}
.s{display:inline}
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 156" width="830" height="156" role="img" aria-labelledby="t d"><title id="t">Fraud Detection Engine: 99.76% recall on fraudulent claims</title><desc id="d">Cost-sensitive threshold tuning with SMOTE, built to minimise missed fraud over raw accuracy.</desc><style>@font-face{font-family:GSESerif;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:GSE;font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:GSE,"Google Sans",system-ui,sans-serif;text-rendering:geometricPrecision}text.serif{font-family:GSESerif,"Instrument Serif",Georgia,serif}text.italic{font-style:italic}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.35)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes sweep{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.68}}
.fade{animation:fade .9s ease-out backwards}
.sweep{animation:sweep 7s linear infinite;will-change:transform}
.wave{animation:wave 3.4s ease-in-out infinite}
.rise,.col{animation:rise .75s cubic-bezier(.22,.8,.24,1) backwards}
.pop{animation:pop .7s cubic-bezier(.3,1.4,.5,1) backwards;transform-box:fill-box;transform-origin:50% 50%}
.grow{animation:grow .85s cubic-bezier(.22,.8,.24,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
.draw{stroke-dasharray:1;animation:draw .9s ease-out backwards}
.s{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.m{display:none}
.s{display:inline}
}
</style><defs><clipPath id="card"><rect width="830" height="156" rx="0"/></clipPath></defs><g clip-path="url(#card)"><rect width="830" height="156" fill="#F0E8D6"/><path d="M0 0.5H830" stroke="#53725D" stroke-width="1" class="fade" style="animation-delay:2.13s"/><text x="40" y="80" font-size="34" font-weight="400" fill="#1F4B35" class="serif rise" style="animation-delay:2.20s">99.76%</text><text x="40" y="106" font-size="10.5" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:2.28s">recall on fraudulent claims</text><text x="40" y="122" font-size="10.5" font-weight="600" fill="#1F4B35" class="rise" style="animation-delay:2.34s">0.9993 ROC-AUC via LightGBM</text><path d="M250 24V136" stroke="#53725D" stroke-width="1" class="fade" style="animation-delay:2.23s"/><text x="282" y="56" font-size="22" font-weight="400" fill="#1F4B35" class="serif rise" style="animation-delay:2.24s">Fraud Detection Engine</text><text x="282" y="82" font-size="13" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:2.34s">Cost-sensitive threshold tuning with SMOTE, built to minimise missed fraud over</text><text x="282" y="101" font-size="13" font-weight="400" fill="#5E7A65" class="rise" style="animation-delay:2.41s">raw accuracy.</text><g class="rise" style="animation-delay:2.48s"><rect x="282.0" y="112" width="55.1" height="20" rx="10" fill="none" stroke="#1F4B35" stroke-width="1.3"/></g><text x="309.535" y="126" font-size="10.5" font-weight="600" fill="#1F4B35" text-anchor="middle" class="rise" style="animation-delay:2.48s">Python</text><g class="rise" style="animation-delay:2.53s"><rect x="344.1" y="112" width="69.6" height="20" rx="10" fill="none" stroke="#1F4B35" stroke-width="1.3"/></g><text x="378.871" y="126" font-size="10.5" font-weight="600" fill="#1F4B35" text-anchor="middle" class="rise" style="animation-delay:2.53s">LightGBM</text><g class="rise" style="animation-delay:2.58s"><rect x="420.7" y="112" width="79.7" height="20" rx="10" fill="none" stroke="#1F4B35" stroke-width="1.3"/></g><text x="460.545" y="126" font-size="10.5" font-weight="600" fill="#1F4B35" text-anchor="middle" class="rise" style="animation-delay:2.58s">Scikit-Learn</text><g class="rise" style="animation-delay:2.63s"><rect x="507.4" y="112" width="56.1" height="20" rx="10" fill="none" stroke="#1F4B35" stroke-width="1.3"/></g><text x="535.482" y="126" font-size="10.5" font-weight="600" fill="#1F4B35" text-anchor="middle" class="rise" style="animation-delay:2.63s">SMOTE</text><g class="m"><g><animateTransform attributeName="transform" type="translate" values="0 0;4 -4;0 0" dur="2.8s" begin="2.53s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"/><path d="M781 81L799 63M789.1 63H799V72.9" fill="none" stroke="#D8402B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="s"><path d="M781 81L799 63M789.1 63H799V72.9" fill="none" stroke="#D8402B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
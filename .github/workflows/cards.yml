name: cards

on:
  schedule:
    # 04:17 UTC daily, on the hour offset so GitHub isn't hammered at :00
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/contributions.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
